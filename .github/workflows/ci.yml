name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate all SKILL.md files
        run: node scripts/validate-skill.mjs

      - name: Build eval fixtures
        run: node scripts/eval/run.mjs --setup

      - name: Run evidence eval
        run: node scripts/eval/run.mjs

      - name: Render golden test (HTML + PDF smoke)
        run: node test/render.test.mjs
