---
name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What did you say/run, against which repo, with what time window?
      placeholder: |
        1. Installed the skill via /plugin install ...
        2. Ran: "weekly report from ./foo, last 7 days"
        3. It produced ...
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
