---
name: Feature request
description: Suggest a new capability or behavior for the skill
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The workflow or pain point this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the skill do differently? Concrete examples help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Anything you already tried (other skills, scripts, manual git commands).
